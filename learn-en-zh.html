<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EN·中 — Học tiếng Anh & tiếng Trung</title>
<style>
:root{
  --bg:#0e1117; --bg2:#161b24; --card:#1b2230; --line:#28324a;
  --tx:#e8edf6; --tx2:#9aa7bd; --tx3:#6b7893;
  --en:#4c9aff; --zh:#ff7a59; --ok:#3ddc97; --warn:#ffcc66; --bad:#ff6b6b;
  --rad:16px; --shadow:0 6px 24px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#f4f6fb; --bg2:#ffffff; --card:#ffffff; --line:#dfe5f0;
  --tx:#141a26; --tx2:#5a6579; --tx3:#8a95a9; --shadow:0 6px 20px rgba(20,30,60,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  -webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0 0 .4em;line-height:1.25}
h1{font-size:1.4rem}h2{font-size:1.1rem}h3{font-size:1rem}
a{color:var(--en)}
.wrap{max-width:840px;margin:0 auto;padding:0 14px 96px}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg),var(--bg) 70%,rgba(0,0,0,0));
  backdrop-filter:blur(6px);padding:12px 14px 6px}
.topin{max-width:840px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--en);box-shadow:0 0 0 3px rgba(76,154,255,.18)}
.brand .zh{color:var(--zh)}
.spacer{flex:1}
.pill{font-size:.8rem;color:var(--tx2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill b{color:var(--tx)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 10px;max-width:840px;margin:0 auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--tx2);
  padding:7px 13px;border-radius:999px;font-size:.86rem;cursor:pointer}
nav.tabs button.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.muted{color:var(--tx2)}.tiny{font-size:.8rem;color:var(--tx3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:560px){.g4{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .n{font-size:1.45rem;font-weight:700;line-height:1.1}
.stat .l{font-size:.74rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em}
button.btn,input[type=text],select,textarea{font:inherit}
.btn{background:var(--tx);color:var(--bg);border:0;border-radius:12px;padding:11px 18px;font-weight:650;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line);font-weight:550}
.btn.sm{padding:6px 11px;font-size:.82rem;border-radius:10px}
.btn.ok{background:var(--ok);color:#04121b}.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],select{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--tx);
  border-radius:12px;padding:11px 13px;outline:none}
input[type=text]:focus,select:focus{border-color:var(--en)}
input[type=range]{width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg2)}
.seg button{background:transparent;border:0;color:var(--tx2);padding:7px 15px;cursor:pointer;font-size:.85rem}
.seg button.on{background:var(--tx);color:var(--bg);font-weight:650}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--tx2)}
.tag.en{border-color:rgba(76,154,255,.5);color:var(--en)}
.tag.zh{border-color:rgba(255,122,89,.5);color:var(--zh)}
.big{font-size:2.4rem;font-weight:700;line-height:1.15;letter-spacing:.5px}
.big.cjk{font-size:3rem}
.sub{font-size:1.05rem;color:var(--tx2)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.opt{display:block;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);color:var(--tx);
  border-radius:12px;padding:12px 14px;margin:7px 0;cursor:pointer;font-size:.97rem}
.opt:hover{border-color:var(--en)}
.opt.right{border-color:var(--ok);background:rgba(61,220,151,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.12)}
.opt[disabled]{cursor:default}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--en);border-radius:99px;transition:width .2s}
.flip{cursor:pointer;user-select:none;text-align:center;padding:26px 14px;min-height:190px;display:flex;
  flex-direction:column;justify-content:center;gap:6px;background:var(--bg2);border:1px dashed var(--line);
  border-radius:var(--rad);transition:border-color .2s}
.flip:hover{border-color:var(--en)}
.flip.open{border-style:solid}
.wlist .w{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.wlist .w:last-child{border-bottom:0}
.w .t{font-weight:650;font-size:1.05rem}
.w .py{font-size:.82rem;color:var(--tx3)}
.w .m{flex:1;min-width:0}
.w .vi{font-size:.92rem;color:var(--tx2)}
.ico{background:transparent;border:1px solid var(--line);color:var(--tx2);border-radius:10px;width:34px;height:34px;
  cursor:pointer;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.ico:hover{color:var(--tx);border-color:var(--en)}
.lesson .line{padding:10px 0;border-bottom:1px solid var(--line)}
.lesson .line:last-child{border-bottom:0}
.lesson .sp{font-size:.74rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}
.hide{background:var(--line);color:transparent;border-radius:6px;padding:0 6px;cursor:pointer}
.hide.shown{background:transparent;color:var(--tx2)}
.note{border-left:3px solid var(--warn);background:rgba(255,204,102,.08);padding:9px 12px;border-radius:0 10px 10px 0;font-size:.86rem;color:var(--tx2)}
.err{border-left:3px solid var(--bad);background:rgba(255,107,107,.08);padding:9px 12px;border-radius:0 10px 10px 0;font-size:.86rem}
.center{text-align:center}
kbd{background:var(--line);border-radius:5px;padding:1px 6px;font-size:.78rem}
.char{display:inline-flex;flex-direction:column;align-items:center;background:var(--bg2);border:1px solid var(--line);
  border-radius:12px;padding:8px 10px;margin:4px 6px 0 0}
.char b{font-size:1.5rem}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--tx);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:.86rem;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:88vw}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

  <div class="brand"><span class="dot"></span>EN<span class="zh">·中</span></div>

<div class="wrap"><main id="main"></main></div>

/* ============================ CHUẨN HÓA DỮ LIỆU ============================ */
function stripTone(s){return (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z]/g,"");}
const WORDS = [];
const BY_ID = Object.create(null);
EN.forEach(function(r,i){
  const w={id:"en:"+i, lang:"en", term:r[0], ipa:r[1], vi:r[2], topic:r[3],
    ex:{en:r[4], vi:r[5]}, pinyin:"", key:r[0].toLowerCase(), pkey:r[0].toLowerCase()};
  WORDS.push(w); BY_ID[w.id]=w;
});
ZH.forEach(function(r,i){
  const w={id:"zh:"+i, lang:"zh", term:r[0], pinyin:r[1], vi:r[2], topic:r[3],
    ipa:"", ex:{zh:r[4], py:r[5], vi:r[6]}, key:r[0], pkey:stripTone(r[1])};
  WORDS.push(w); BY_ID[w.id]=w;
});
const BY_CHAR = Object.create(null);
WORDS.filter(function(w){return w.lang==="zh";}).forEach(function(w){
  Array.from(w.term).forEach(function(ch){ if(!BY_CHAR[ch]) BY_CHAR[ch]=w; });
});
function topicsOf(lang){
  const s=new Set(); WORDS.forEach(function(w){ if(w.lang===lang) s.add(w.topic); }); return Array.from(s).sort();
}
/* ============================ STORAGE ============================ */
const LSKEY="lez:v1";
const Store=(function(){
  let mode="ls", data=null, idb=null, ready=false;
  function blank(){
    return {version:1, states:{}, custom:[],
      stats:{streak:0, lastDay:null, todayCount:0, totalReviews:0, quizzes:[]},
      settings:{theme:"dark", rate:0.9, lang:"en", limit:20, voiceEn:"", voiceZh:""}};
  }
  function lsGet(){ try{ return localStorage.getItem(LSKEY); }catch(e){ return null; } }
  function lsSet(v){ try{ localStorage.setItem(LSKEY,v); return true; }catch(e){ return false; } }
  function openIDB(){
    return new Promise(function(res,rej){
      if(!window.indexedDB) return rej("noidb");
      let r; try{ r=indexedDB.open("lez",1); }catch(e){ return rej(e); }
      r.onupgradeneeded=function(){ r.result.createObjectStore("kv"); };
      r.onsuccess=function(){ idb=r.result; res(); };
      r.onerror=function(){ rej("idberr"); };
      setTimeout(function(){ if(!idb) rej("idbtimeout"); }, 1500);
    });
  }
  function idbGet(){ return new Promise(function(res,rej){ const q=idb.transaction("kv").objectStore("kv").get(LSKEY);
    q.onsuccess=function(){res(q.result||null)}; q.onerror=function(){rej("geterr")}; }); }
  function idbSet(v){ return new Promise(function(res,rej){ const t=idb.transaction("kv","readwrite");
    t.objectStore("kv").put(v,LSKEY); t.oncomplete=res; t.onerror=function(){rej("seterr")}; }); }
  function merge(src){
    const d=blank();
    if(src && typeof src==="object"){
      data=d; hydrate(src); return;
    }
    data=d;
  }
  function hydrate(src){
    const d=data;
    if(src.states) Object.keys(src.states).forEach(function(k){ d.states[k]=normState(src.states[k]); });
    if(src.custom && src.custom.length) d.custom=src.custom;
    if(src.settings) Object.keys(d.settings).forEach(function(k){ if(src.settings[k]!==undefined) d.settings[k]=src.settings[k]; });
    if(src.stats){
      d.stats=Object.assign(d.stats,src.stats);
      if(!Array.isArray(d.stats.quizzes)) d.stats.quizzes=[];
    }
  }
  function normState(s){
    s=s||{};
    return {box:Math.max(1,Math.min(5, s.box|0 || 1)), due:String(s.due||todayStr()), reps:(s.reps|0)||0, lapses:(s.lapses|0)||0};
  }
  function init(){
    return new Promise(function(res){
      let settled=false;
      const done=function(){
        if(settled) return; settled=true;
        if(!data){ data=blank(); if(!lsGet()) mode="mem"; }
        if(!ready){ ready=true; res2(); }
        res();
      };
      setTimeout(done,3000);
      let lsOK=false;
      try{ localStorage.setItem(LSKEY+".probe","1"); localStorage.removeItem(LSKEY+".probe"); lsOK=true; }catch(e){ lsOK=false; }
      if(lsOK){
        mode="ls"; data=blank();
        const raw=lsGet();
        if(raw){ try{ hydrate(JSON.parse(raw)); }catch(e){} }
        else { lsSet(JSON.stringify(data)); }
        done(); return;
      }
      openIDB().then(function(){ return idbGet(); }).then(function(v){
        mode="idb"; data=blank(); if(v){ try{ hydrate(JSON.parse(v)); }catch(e){} } else { idbSet(JSON.stringify(data)).catch(function(){}); }
        done();
      }).catch(function(){ mode="mem"; data=blank(); done(); });
    });
  }
  let res2=function(){};
  const p=new Promise(function(r){ res2=r; });
  return {
    ready:p,
    boot:init,
    get mode(){ return mode; },
    get s(){ return data.settings; },
    get stats(){ return data.stats; },
    state(id){ return data.states[id]; },
    all(){ return data.states; },
    custom(){ return data.custom; },
    touch(id){ data.states[id]=data.states[id]||normState({box:1,due:todayStr()}); return data.states[id]; },
    setState(id,st){ data.states[id]=st; },
    set(key,val){ data.settings[key]=val; this.save(); },
    save(){
      const v=JSON.stringify(data);
      if(mode==="ls"){ if(lsSet(v)) return Promise.resolve("ls"); mode="idb"; }
      if(mode==="idb"){
        if(!idb) return openIDB().then(function(){ return idbSet(v); }).then(function(){return "idb"}).catch(function(){mode="mem";return "mem"});
        return idbSet(v).then(function(){return "idb"}).catch(function(){ mode="mem"; return "mem"; });
      }
      return Promise.resolve("mem");
    },
    raw(){ return JSON.stringify(data); },
    loadJSON(obj){ data=blank(); hydrate(obj); return this.save(); },
    wipe(){ data=blank(); return this.save(); }
  };
})();
/* ============================ SRS ============================ */
function todayStr(offset){
  const d=new Date(); if(offset) d.setDate(d.getDate()+offset);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
const INTERVAL=[0,1,3,7,16,35];
const BOX_NAME=["","Mới","Đang học","Tốt","Thành thạo","Xuất sắc"];
function ratingFor(w,rate){
  const st=Store.touch(w.id);
  const isEn=w.lang==="en";
  if(rate===0){ st.box=1; st.lapses++; st.due=todayStr(); }
  else if(rate===1){ st.box=Math.max(1,st.box-1); st.due=todayStr(isEn?1:1); }
  else if(rate===2){ st.box=Math.min(5,st.box+1); st.due=todayStr(INTERVAL[st.box]); }
  else { st.box=Math.min(5,st.box+2); st.due=todayStr(Math.round(INTERVAL[st.box]*2.5)); }
  st.reps++;
  const s=Store.stats;
  s.todayCount++; s.totalReviews++;
  if(s.lastDay!==todayStr()){
    s.streak = (s.lastDay===todayStr(-1)) ? s.streak+1 : 1;
    s.lastDay=todayStr();
  }
  Store.save();
  paintPills();
}
function dueCount(lang){
  let n=0;
  WORDS.forEach(function(w){ if(w.lang!==lang) return; const st=Store.state(w.id); if(st && st.due<=todayStr()) n++; });
  Store.custom().forEach(function(w){ if(w.lang===lang){ const st=Store.state(w.id); if(!st||st.due<=todayStr()) n++; } });
  return n;
}
function newCount(lang){
  let n=0; WORDS.forEach(function(w){ if(w.lang===lang && !Store.state(w.id)) n++; }); return n;
}
function learnedCount(lang){
  let n=0; WORDS.forEach(function(w){ if(w.lang===lang){ const st=Store.state(w.id); if(st && st.box>=2) n++; } }); return n;
}
function buildQueue(lang,limit,newLimit){
  const pool=WORDS.filter(function(w){ return w.lang===lang; }).concat(Store.custom());
  const due=[], fresh=[];
  pool.forEach(function(w){
    const st=Store.state(w.id);
    if(!st){ fresh.push(w); }
    else if(st.due<=todayStr()){ due.push({w:w,box:st.box}); }
  });
  due.sort(function(a,b){ return a.box-b.box; });
  const out=shuffle(due.map(function(o){ return o.w; })).slice(0,limit);
  const room=limit-out.length;
  if(room>0) out.push.apply(out, shuffle(fresh).slice(0, Math.min(room, newLimit==null? room : newLimit)));
  if(out.length<limit){
    pool.forEach(function(w){ if(out.indexOf(w)<0 && out.length<limit) out.push(w); });
  }
  return out;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t;} return a; }
function boxOf(id){ const st=Store.state(id); return st?st.box:0; }
/* ============================ TTS ============================ */
const TTS=(function(){
  const supported = "speechSynthesis" in window;
  let voices=[];
  if(supported){
    const load=function(){ voices=speechSynthesis.getVoices()||[]; document.dispatchEvent(new CustomEvent("voices-ready")); };
    voices=speechSynthesis.getVoices()||[];
    speechSynthesis.onvoiceschanged=load;
    load();
  }
  function pick(lang){
    if(!voices.length) return null;
    const want=lang==="zh" ? "zh" : "en";
    const pref=Store.s[lang==="zh"?"voiceZh":"voiceEn"];
    if(pref){ const v=voices.filter(function(x){return x.name===pref})[0]; if(v) return v; }
    return voices.filter(function(v){ return v.lang.toLowerCase().startsWith(want); })[0] || null;
  }
  return {
    supported:supported,
    list:voices,
    refresh:function(){ voices=supported?speechSynthesis.getVoices()||[]:[]; },
    forLang:function(lang){ return voices.filter(function(v){ return v.lang.toLowerCase().startsWith(lang); }); },
    has:function(lang){ return !!pick(lang); },
    speak:function(text,lang){
      if(!supported || !text) return false;
      try{
        speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(text);
        u.lang = lang==="zh" ? "zh-CN" : "en-US";
        const v=pick(lang); if(v) u.voice=v;
        u.rate=Store.s.rate||0.9; u.pitch=1;
        speechSynthesis.speak(u); return true;
      }catch(e){ return false; }
    },
    playURL:function(url){
      try{ const a=new Audio(url); a.play().catch(function(){}); return true; }catch(e){ return false; }
    },
    stop:function(){ if(supported) try{ speechSynthesis.cancel(); }catch(e){} }
  };
})();
function speakBtn(word){
  return '<button class="ico" data-say="'+word.id+'" title="Nghe phát âm">🔊</button>';
}
document.addEventListener("click",function(ev){
  const b=ev.target.closest("[data-say]");
  if(!b) return;
  const w=byId(b.getAttribute("data-say")); if(!w) return;
  const text = (w.lang==="en") ? w.term : w.term;
  const ok=TTS.speak(text,w.lang);
  if(!ok) toast("Thiết bị không có giọng đọc cho "+(w.lang==="zh"?"tiếng Trung":"tiếng Anh"));
  else if(w.lang==="zh" && !TTS.has("zh")) toast("Máy chưa cài giọng zh-CN — đang dùng giọng dự kiến");
});
function byId(id){
  const w=BY_ID[id]; if(w) return w;
  return Store.custom().filter(function(c){return c.id===id})[0]||null;
}

const Cards=(function(){
  let q=[], i=0, flipped=false, active=null;
  function start(lang,mode){
    const limit=Store.s.limit;
    q = mode==="all" ? WORDS.filter(function(w){return w.lang===lang}) : buildQueue(lang,limit,true);
    i=0; flipped=false; render();
  }
  function render(){
    if(!q.length){ $("#main").innerHTML='<div class="card center"><h2>Không có thẻ nào</h2><button class="btn ghost" data-go="home">Về trang chủ</button></div>'; return; }
    if(i>=q.length){
      $("#main").innerHTML='<div class="card center"><h1>Xong rồi! 🎉</h1><p class="muted">Bạn đã ôn '+q.length+' thẻ. Số liệu đã lưu.</p>'+
        '<div class="row" style="justify-content:center"><button class="btn" data-go="cards">Ôn tiếp</button><button class="btn ghost" data-go="quiz">Làm quiz</button></div></div>';
      return;
    }
    active=q[i];
    const w=active, st=Store.state(w.id)||{box:1,reps:0};
    const termCls = w.lang==="zh" ? "big cjk" : "big";
    $("#main").innerHTML=
      '<div class="card">'+
        '<div class="row" style="justify-content:space-between">'+
          '<span class="tag '+(w.lang==="en"?"en":"zh")+'">'+esc(w.topic)+'</span>'+
          '<span class="tiny muted">Hộp '+st.box+'/5 · '+(BOX_NAME[st.box]||"Mới")+(st.reps?" · đã ôn "+st.reps+" lần":"")+'</span>'+
        '</div>'+
        '<div class="bar" style="margin:10px 0 0"><i style="width:'+Math.round(i/q.length*100)+'%"></i></div>'+
        '<div class="tiny muted" style="margin-top:6px">'+(i+1)+' / '+q.length+' — bấm thẻ hoặc <kbd>Space</kbd> để lật</div>'+
        '<div class="flip'+(flipped?" open":"")+'" id="flip">'+
          '<div class="'+termCls+'">'+esc(w.term)+'</div>'+
          (w.ipa?'<div class="sub">'+esc(w.ipa)+'</div>':'')+
          (w.pinyin?'<div class="sub" style="color:var(--zh)">'+esc(w.pinyin)+'</div>':'')+
          (flipped
            ? '<hr><div style="font-size:1.25rem;font-weight:650">'+esc(w.vi)+'</div>'+
              '<div class="muted" style="font-size:.92rem;margin-top:6px">'+esc(w.lang==="zh"?(w.ex.zh||""):(w.ex.en||""))+'</div>'+
              (w.lang==="zh"&&w.ex.py?'<div class="tiny muted">'+esc(w.ex.py)+'</div>':'')+
              '<div class="tiny" style="color:var(--tx2)">'+esc(w.ex.vi||"")+'</div>'
            : '<div class="tiny muted" style="margin-top:10px">Bấm để xem nghĩa</div>')+
        '</div>'+
        '<div class="row" style="margin-top:12px;justify-content:center">'+
          '<button class="btn ghost sm" data-say="'+w.id+'">🔊 Đọc từ</button>'+
          '<button class="btn ghost sm" id="sayEx" data-say-ex="1">💬 Đọc ví dụ</button>'+
        '</div>'+
        (flipped?rateRow():'<div class="note" style="margin-top:12px">Nghĩa Việt đến từ bộ dữ liệu nhúng trong app — luôn dùng được khi mất mạng.</div>')+
      '</div>';
  }
  function rateRow(){
    return '<div class="grid g4" style="margin-top:14px">'+
      '<button class="btn bad" data-rate="0">Chưa nhớ<span class="tiny" style="display:block;color:inherit;opacity:.7">hộp 1</span></button>'+
      '<button class="btn ghost" data-rate="1">Mờ mờ<span class="tiny" style="display:block">-1 hộp</span></button>'+
      '<button class="btn ok" data-rate="2">Nhớ<span class="tiny" style="display:block;color:inherit;opacity:.7">+1 hộp</span></button>'+
      '<button class="btn ghost" data-rate="3">Rất chắc<span class="tiny" style="display:block">+2 hộp</span></button>'+
      '</div><div class="tiny muted center" style="margin-top:8px">Phím tắt <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> · <kbd>←</kbd> về trước</div>';
  }
  function flip(){ flipped=!flipped; render(); if(flipped) TTS.speak(active.term,active.lang); }
  function rate(r){
    ratingFor(active,r);
    if(r===0) q.push(active);
    i++; flipped=false; render();
  }
  document.addEventListener("click",function(ev){
    if(ev.target.closest("#sayEx")){
      const w=active; if(!w) return;
      const t = w.lang==="zh" ? (w.ex.zh||w.term) : (w.ex.en||w.term);
      if(!TTS.speak(t,w.lang)) toast("Không có giọng đọc trên thiết bị này");
      return;
    }
    const b=ev.target.closest("[data-rate]");
    if(b){ rate(+b.getAttribute("data-rate")); return; }
    if(ev.target.closest("#flip")) flip();
  });
  document.addEventListener("keydown",function(ev){
    if($("#main").querySelector("#flip")===null) return;
    if(ev.code==="Space"){ ev.preventDefault(); if(!flipped) flip(); }
    else if(["Digit1","Digit2","Digit3","Digit4"].indexOf(ev.code)>=0 && flipped){
      ev.preventDefault(); rate(+ev.code.slice(5)-1);
    }
  });
  return {start:start};
})();
/* ============================ MÀN: QUIZ ============================ */
const Quiz=(function(){
  let qs=[], i=0, score=0, lang="en", answered=false;
  function opts(correct,pool,keyFn,n){
    const chosen=[]; const seen=new Set([keyFn(correct)]);
    const shuffled=shuffle(pool.filter(function(w){return keyFn(w)!==keyFn(correct)}));
    for(const w of shuffled){ if(chosen.length>=n-1) break; if(seen.has(keyFn(w))) continue; seen.add(keyFn(w)); chosen.push(w); }
    return shuffle([correct].concat(chosen));
  }
  function build(l,limit){
    lang=l;
    const pool=WORDS.filter(function(w){return w.lang===lang});
    const known=pool.filter(function(w){return !!Store.state(w.id)});
    const src=known.length>=8?known:pool;
    qs=[];
    const types=["vi","term","pinyin","listen","cloze"];
    for(let k=0;k<limit;k++){
      const w=src[Math.floor(Math.random()*src.length)];
      let t=types[Math.floor(Math.random()*types.length)];
      if(w.lang==="en" && t==="pinyin") t="spell";
      qs.push({w:w,t:t,pool:src});
    }
    i=0;score=0;render();
  }
  function render(){
    if(i>=qs.length){
      const s=Store.stats; s.quizzes.push({d:todayStr(),score:score,total:qs.length,lang:lang});
      if(s.quizzes.length>50) s.quizzes=s.quizzes.slice(-50);
      Store.save();
      const pct=Math.round(score/qs.length*100);
      $("#main").innerHTML='<div class="card center"><h1>'+score+" / "+qs.length+'</h1>'+
        '<p class="'+(pct>=70?"":"muted")+'" style="font-size:1.05rem">'+(pct>=90?"Xuất sắc!":pct>=70?"Khá tốt — giữ nhịp này nhé":pct>=40?"Ổn, ôn lại mấy từ còn sai":"Cần ôn thẻ thêm vài hôm")+'</p>'+
        '<div class="bar" style="margin:14px 0"><i style="width:'+pct+'%"></i></div>'+
        '<div class="row" style="justify-content:center"><button class="btn" data-go="quiz">Vòng mới</button><button class="btn ghost" data-go="cards">Ôn thẻ</button></div></div>';
      return;
    }
    const q=qs[i], w=q.w;
    answered=false;
    let head="", body="", correctKey="";
    if(q.t==="vi"){
      head='<div class="tiny muted">Nghĩa tiếng Việt của từ này là gì?</div><div class="'+(w.lang==="zh"?"big cjk":"big")+'">'+esc(w.term)+'</div>'+
        (w.lang==="zh"?'<div class="sub" style="color:var(--zh)">'+esc(w.pinyin)+'</div>':'<div class="sub">'+esc(w.ipa)+'</div>');
      const o=opts(w,q.pool,function(x){return x.vi});
      correctKey=w.vi;
      body=o.map(function(x){return '<button class="opt" data-k="'+esc(x.vi)+'">'+esc(x.vi)+'</button>'}).join("");
    } else if(q.t==="term"){
      head='<div class="tiny muted">Từ nào có nghĩa là…</div><div class="big" style="font-size:1.7rem">'+esc(w.vi)+'</div>';
      const o=opts(w,q.pool,function(x){return x.term});
      correctKey=w.term;
      body=o.map(function(x){return '<button class="opt" data-k="'+esc(x.term)+'">'+esc(x.term)+'<span class="tiny muted" style="display:block">'+esc(x.lang==="zh"?x.pinyin:x.ipa)+'</span></button>'}).join("");
    } else if(q.t==="pinyin"||q.t==="spell"){
      head='<div class="tiny muted">'+(q.t==="pinyin"?"Nhập pinyin (không cần dấu thanh):":"Viết lại từ tiếng Anh:")+'</div><div class="big cjk" style="font-size:2.2rem">'+esc(w.term)+'</div>'+
        '<div class="sub">'+esc(w.vi)+'</div>';
      body='<input type="text" id="qin" placeholder="'+(q.t==="pinyin"?"ni hao":"apple")+'" autocomplete="off" autocapitalize="off">'+
           '<button class="btn" id="qgo" style="margin-top:10px">Kiểm tra</button><div id="qres" style="margin-top:10px"></div>';
      correctKey=q.t==="pinyin"?w.pkey:w.term.toLowerCase();
    } else if(q.t==="listen"){
      head='<div class="tiny muted">Nghe và chọn đúng từ</div><div class="center" style="padding:10px 0">'+
        '<button class="btn ghost" id="replay">🔊 Nghe lại</button></div>';
      const o=opts(w,q.pool,function(x){return x.term});
      correctKey=w.term;
      body=o.map(function(x){return '<button class="opt" data-k="'+esc(x.term)+'">'+esc(x.term)+'</button>'}).join("");
      setTimeout(function(){ TTS.speak(w.term,w.lang); },250);
    } else { /* cloze */
      const sent = w.lang==="zh" ? (w.ex.zh||"") : (w.ex.en||"");
      if(!sent) return next();
      const blanked = sent.replace(new RegExp(w.term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"),"＿＿＿");
      head='<div class="tiny muted">Chọn từ điền vào chỗ trống</div><div style="font-size:1.15rem;line-height:1.6">'+esc(blanked)+'</div>'+
        '<div class="tiny muted" style="margin-top:4px">'+esc(w.ex.vi)+'</div>';
      const o=opts(w,q.pool.filter(function(x){return !!x.ex}),function(x){return x.term});
      correctKey=w.term;
      body=o.map(function(x){return '<button class="opt" data-k="'+esc(x.term)+'">'+esc(x.term)+'</button>'}).join("");
    }
    $("#main").innerHTML='<div class="card">'+
      '<div class="row" style="justify-content:space-between"><span class="tag '+(lang==="en"?"en":"zh")+'">Quiz '+esc(lang==="en"?"Anh":"Trung")+'</span>'+
      '<span class="tiny muted">Câu '+(i+1)+'/'+qs.length+' · Điểm '+score+'</span></div>'+
      '<div class="bar" style="margin:10px 0 14px"><i style="width:'+Math.round(i/qs.length*100)+'%"></i></div>'+
      '<div class="center">'+head+'</div><div style="margin-top:14px">'+body+'</div><div id="qf"></div></div>';
    $("#qf").innerHTML="";
    const inputs=$("#main").querySelectorAll(".opt");
    inputs.forEach(function(b){ b.addEventListener("click",function(){
      if(answered) return; answered=true;
      const ok=b.getAttribute("data-k")===correctKey;
      inputs.forEach(function(x){ const isOk=x.getAttribute("data-k")===correctKey; if(isOk)x.classList.add("right"); });
      if(!ok) b.classList.add("wrong");
      if(ok){ score++; Store.touch(w.id); }
      else { const st=Store.touch(w.id); st.lapses++; }
      Store.save();
      $("#qf").innerHTML=(ok?'<div class="note" style="border-left-color:var(--ok)">Đúng rồi'+(w.lang==="zh"?" — "+esc(w.pinyin):"")+'</div>'
        :'<div class="err">Sai rồi — đáp án: <b>'+esc(correctKey)+'</b><br><span class="tiny">'+esc(w.vi)+(w.lang==="zh"?" · "+esc(w.pinyin):"")+'</span></div>')+
        '<button class="btn" id="qnext" style="margin-top:12px;width:100%">'+(i+1>=qs.length?"Xem kết quả":"Câu tiếp")+'</button>';
      $("#qnext").addEventListener("click",next);
      if(w.lang!=="en") TTS.speak(w.term,w.lang);
    });});
    const rp=$("#replay"); if(rp) rp.addEventListener("click",function(){ TTS.speak(w.term,w.lang); });
    const qgo=$("#qgo");
    if(qgo) qgo.addEventListener("click",function(){
      if(answered) return;
      const val=($("#qin").value||"").trim();
      if(!val){ toast("Nhập câu trả lời trước đã"); return; }
      answered=true;
      const given = q.t==="pinyin" ? stripTone(val) : val.toLowerCase().replace(/[^a-z]/g,"");
      const ok = given===correctKey.replace(/[^a-z]/g,"");
      if(ok) score++;
      $("#qres").innerHTML=(ok?'<div class="note" style="border-left-color:var(--ok)">Đúng: '+esc(correctKey===w.pkey?w.pinyin:w.term)+'</div>'
        :'<div class="err">Đáp án: <b>'+esc(q.t==="pinyin"?w.pinyin:w.term)+'</b></div>');
      $("#qgo").outerHTML='<button class="btn" id="qnext" style="margin-top:10px;width:100%">'+(i+1>=qs.length?"Xem kết quả":"Câu tiếp")+'</button>';
      $("#qnext").addEventListener("click",next);
    });
    if($("#qin")) $("#qin").addEventListener("keydown",function(e){ if(e.key==="Enter" && !answered) $("#qgo").click(); });
  }
  function next(){ i++; render(); }
  return {build:build};
})();

        '<option value="new"'+(f.status==="new"?" selected":"")+'>Chưa học</option>'+
        '<option value="due"'+(f.status==="due"?" selected":"")+'>Đến hạn</option>'+
        '<option value="learn"'+(f.status==="learn"?" selected":"")+'>Đang học</option>'+
        '<option value="master"'+(f.status==="master"?" selected":"")+'>Đã nhớ</option></select>'+
      '</div><input type="text" id="wq" placeholder="Tìm theo chữ, pinyin hoặc nghĩa Việt…" value="'+esc(f.q)+'">'+
      '<div class="tiny muted" style="margin-top:8px">'+list.length+' từ</div></div>'+
      '<div class="card wlist">'+(list.length?list.map(row).join(""):'<div class="muted center">Không tìm thấy từ nào.</div>')+'</div>';
    $("#wl").addEventListener("click",function(ev){const b=ev.target.closest("[data-v]");if(b){f.lang=b.getAttribute("data-v");f.topic="";render();}});
    $("#wt").addEventListener("change",function(){f.topic=this.value;render();});
    $("#ws").addEventListener("change",function(){f.status=this.value;render();});
    let t=null;
    $("#wq").addEventListener("input",function(){ clearTimeout(t); const v=this.value; t=setTimeout(function(){f.q=v;render(); $("#wq").focus(); $("#wq").setSelectionRange(v.length,v.length);},180); });
  }
  function row(w){
    const st=Store.state(w.id);
    return '<div class="w">'+speakBtn(w)+'<div class="m">'+
      '<div class="row" style="gap:8px"><span class="t">'+esc(w.term)+'</span>'+
      (w.lang==="zh"?'<span class="py">'+esc(w.pinyin)+'</span>':'<span class="py">'+esc(w.ipa)+'</span>')+
      '<span class="tag">'+esc(w.topic)+'</span></div>'+
      '<div class="vi">'+esc(w.vi)+(w.ex&&w.ex.vi?' <span class="tiny">· '+esc(w.lang==="zh"?(w.ex.py||""):w.ex.en)+'</span>':'')+'</div></div>'+
      '<div style="text-align:right"><div class="tiny muted">'+(st?'Hộp '+st.box+'<br>'+st.due:'Chưa học')+'</div>'+
      '<button class="btn ghost sm" data-bump="'+w.id+'" style="margin-top:4px">Ôn nay</button></div></div>';
  }
  document.addEventListener("click",function(ev){
    const b=ev.target.closest("[data-bump]"); if(!b) return;
    const w=byId(b.getAttribute("data-bump")); if(!w) return;
    const st=Store.touch(w.id); st.due=todayStr(); Store.save();
    toast("Đã xếp «"+w.term+"» vào danh sách ôn hôm nay"); render();
  });
  return {render:render};
})();
/* ============================ MÀN: TRA CỨU ============================ */
const Lookup=(function(){
  let last="";
  function render(){
    $("#main").innerHTML='<div class="card"><h1>Tra cứu</h1>'+
      '<p class="muted" style="margin:0 0 10px">Nhập từ tiếng Anh, chữ Hán hoặc pinyin (không cần dấu). Có mạng sẽ lấy thêm IPA, audio và nghĩa tiếng Anh.</p>'+
      '<input type="text" id="lq" placeholder="apple / 苹果 / ni hao…" value="'+esc(last)+'" autocomplete="off">'+
      '<div class="row" style="margin-top:10px"><button class="btn" id="lgo">Tra</button>'+
      '<label class="tiny muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="lonline" checked> Gọi API khi có mạng</label></div>'+
      '</div><div id="lres"></div>';
    $("#lgo").addEventListener("click",go);
    $("#lq").addEventListener("keydown",function(e){ if(e.key==="Enter") go(); });
  }
  function go(){
    last=$("#lq").value.trim();
    if(!last){ toast("Nhập gì đó để tra"); return; }
    const box=$("#lres");
    const local=localResults(last);
    box.innerHTML='<div class="card">'+(local.length?local.map(cardHtml).join('<hr>'):'<div class="muted">Không có trong bộ dữ liệu nhúng của app.</div>')+
      '</div><div id="lapi"><div class="tiny muted">Đang tra thêm trên mạng…</div></div>';
    if(/^[A-Za]+$/.test(last) && $("#lonline").checked) fetchApi(last).then(function(html){ $("#lapi").innerHTML=html; })
      .catch(function(e){ $("#lapi").innerHTML='<div class="card"><div class="err">'+esc(e.message)+'<br><span class="tiny">Kiểm tra kết nối mạng, hoặc cứ dùng nghĩa Việt ở trên — app vẫn học được offline.</span></div></div>'; });
    else $("#lapi").innerHTML="";
  }
  function localResults(q){
    const ql=q.toLowerCase(), qt=stripTone(q);
    const chars=Array.from(q).filter(function(c){ return BY_CHAR[c]; });
    const out=WORDS.filter(function(w){
      return w.term.toLowerCase()===ql || w.key===ql || stripTone(w.pinyin||w.term)===qt ||
        (w.pinyin && w.pinyin.toLowerCase().replace(/\s/g,"")===qt.replace(/\s/g,"")) ||
        w.term.toLowerCase().indexOf(ql)>=0 || w.vi.toLowerCase().indexOf(ql)>=0 || w.pkey.indexOf(qt)>=0;
    }).slice(0,6);
    if(chars.length && !out.length) chars.forEach(function(c){ out.push(BY_CHAR[c]); });
    return out;
  }
  function cardHtml(w){
    const st=Store.state(w.id);
    return '<div class="row"><div style="flex:1"><div class="row" style="gap:8px">'+
      '<span class="'+(w.lang==="zh"?"big cjk":"big")+'" style="font-size:1.6rem">'+esc(w.term)+'</span>'+
      '<span class="tag '+(w.lang==="en"?"en":"zh")+'">'+(w.lang==="en"?"Anh":"Trung")+'</span>'+
      (w.lang==="zh"?'<span class="sub" style="color:var(--zh)">'+esc(w.pinyin)+'</span>':'<span class="sub">'+esc(w.ipa)+'</span>')+
      '</div><div style="font-size:1.05rem;margin-top:4px">'+esc(w.vi)+'</div>'+
      '<div class="tiny muted" style="margin-top:6px">'+esc(w.lang==="zh"?w.ex.zh:w.ex.en)+'</div>'+
      '<div class="tiny" style="color:var(--tx2)">'+esc(w.ex.vi)+'</div>'+
      (w.lang==="zh"?'<div class="tiny muted">'+esc(w.ex.py)+'</div>':'')+
      '<div class="tiny muted" style="margin-top:6px">Chủ đề: '+esc(w.topic)+(st?' · Hộp '+st.box:' · chưa học')+'</div></div>'+
      speakBtn(w)+'<button class="btn ghost sm" data-bump="'+w.id+'">Ôn nay</button></div>';
  }
  function fetchApi(word){
    return new Promise(function(res,rej){
      if(!window.fetch) return rej(new Error("Trình duyệt không hỗ trợ fetch"));
      const ctl=("AbortController" in window)?new AbortController():null;
      if(ctl) setTimeout(function(){try{ctl.abort()}catch(e){}},7000);
      fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(word.toLowerCase()),ctl?{signal:ctl.signal}:{})
      .then(function(r){ if(!r.ok) throw new Error("API trả về "+r.status); return r.json(); })
      .then(function(j){
        const e=Array.isArray(j)&&j[0]; if(!e) throw new Error("Không tìm thấy từ này");
        const ph=(e.phonetic||e.phonetics||[]).filter(function(p){return typeof p==="string"||p.text;}).map(function(p){return typeof p==="string"?p:p.text}).filter(Boolean)[0]||"";
        const audioList=[];
        (e.phonetics||[]).forEach(function(p){ if(p&&(p.audio||p.text)&&p.audio) audioList.push((p.audio.indexOf("//")===0?"https:":"")+p.audio); });
        const ms=(e.meanings||[]).map(function(m){
          const d=(m.definitions||[])[0]||{};
          return '<div class="tiny" style="margin-top:8px"><b class="muted">'+esc(m.partOfSpeech||"")+'</b> — '+esc(d.definition||"")+
            (d.example?'<div class="tiny muted" style="padding-left:10px">“'+esc(d.example)+'”</div>':"")+'</div>';
        }).join("");
        res('<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Tra thêm: Free Dictionary API</h3>'+
          '<span class="tiny muted">nghĩa tiếng Anh</span></div>'+
          '<div class="row" style="margin-top:8px"><span class="muted">'+esc(e.word)+(ph?' · '+esc(ph):"")+'</span>'+
          audioList.map(function(a,ix){return '<button class="btn ghost sm" data-audio="'+esc(a)+'">🔊 Audio '+(ix+1)+'</button>'}).join("")+'</div>'+
          (ms||'<div class="tiny muted">Không có nghĩa nào trả về.')+
          '<div class="row" style="margin-top:12px"><button class="btn sm" data-addcustom="'+esc(e.word)+'" data-adddef="'+esc(((e.meanings&&e.meanings[0]&&e.meanings[0].definitions&&e.meanings[0].definitions[0]&&e.meanings[0].definitions[0].definition)||""))+'">＋ Thêm vào bộ học</button></div>'+
          '<div class="tiny muted" style="margin-top:8px">API này không dịch sang tiếng Việt — từ thêm vào sẽ mang nghĩa tiếng Anh cho tới khi bạn tự sửa.</div></div>');
      }).catch(function(err){ rej(new Error(err&&err.name==="AbortError"?"Hết thời gian chờ khi gọi API":String(err.message||err))); });
    });
  }
  document.addEventListener("click",function(ev){
    const a=ev.target.closest("[data-audio]");
    if(a){ TTS.playURL(a.getAttribute("data-audio")); return; }
    const c=ev.target.closest("[data-addcustom]");
    if(c){ addCustom(c.getAttribute("data-addcustom"),c.getAttribute("data-adddef")); }
  });
  function addCustom(term,def){
    const d=Store.custom();
    if(d.filter(function(w){return w.term.toLowerCase()===term.toLowerCase()}).length){ toast("Từ đã có trong bộ học"); return; }
    const w={id:"cx:"+term.toLowerCase(),lang:"en",term:term,ipa:"",vi:def||"(chưa có nghĩa Việt)",topic:"Tự thêm",
      ex:{en:"",vi:""},pinyin:"",key:term.toLowerCase(),pkey:term.toLowerCase()};
    d.push(w); Store.touch(w.id); Store.save();
    toast("Đã thêm «"+term+"» — vào mục Ôn thẻ để học");
  }
  return {render:render};
})();
/* ============================ MÀN: SETTINGS ============================ */
function renderSettings(){
  const s=Store.s, st=Store.stats;
  function voiceOpts(lang){
    const list=TTS.forLang(lang==="zh"?"zh":"en");
    if(!list.length) return '<option value="">(không có giọng '+(lang==="zh"?"zh-CN":"en-US")+' trên máy)</option>';
    return '<option value="">Tự động</option>'+list.map(function(v){
      return '<option value="'+esc(v.name)+'"'+(s[lang==="zh"?"voiceZh":"voiceEn"]===v.name?" selected":"")+'>'+esc(v.name)+' — '+esc(v.lang)+'</option>';
    }).join("");
  }
  $("#main").innerHTML='<div class="card"><h1>Cài đặt</h1>'+
    '<div class="grid g2">'+
      '<div><label class="tiny muted">Chủ đề</label><div class="seg" id="thm">'+
        ['dark','light'].map(function(t){return '<button data-t="'+t+'" class="'+(s.theme===t?"on":"")+'">'+(t==="dark"?"Tối":"Sáng")+'</button>'}).join("")+'</div></div>'+
      '<div><label class="tiny muted">Số thẻ mỗi phiên: <b>'+s.limit+'</b></label>'+
        '<input type="range" min="5" max="50" step="5" value="'+s.limit+'" id="lim"></div>'+
      '<div><label class="tiny muted">Tốc độ đọc: <b id="rateLbl">'+s.rate.toFixed(2)+'</b>x</label>'+
        '<input type="range" min="0.6" max="1.2" step="0.05" value="'+s.rate+'" id="rate"></div>'+
      '<div><label class="tiny muted">Giọng tiếng Anh</label><select id="vEn">'+voiceOpts("en")+'</select></div>'+
      '<div><label class="tiny muted">Giọng tiếng Trung</label><select id="vZh">'+voiceOpts("zh")+'</select></div>'+
      '<div class="tiny muted">Lưu trữ: '+storageLabel()+'</div>'+
    '</div></div>'+
    '<div class="card"><h3>Đồng bộ giữa các máy</h3>'+
      '<p class="muted" style="margin:0 0 10px;font-size:.9rem">App chạy offline nên không tự đồng bộ. Bấm <b>Xuất tiến độ</b> ở máy cũ, chép file <code>lap-hoc-tu.json</code> sang máy mới rồi bấm <b>Nhập tiến độ</b>.</p>'+
      '<div class="row"><button class="btn" id="exp">⬇ Xuất tiến độ (.json)</button>'+
      '<button class="btn ghost" id="impBtn">⬆ Nhập tiến độ</button>'+
      '<input type="file" id="imp" accept="application/json,.json" style="display:none">'+
      '<span class="tiny muted">Đã ôn '+st.totalReviews+' lượt · '+Object.keys(Store.all()).length+' từ có dữ liệu · '+st.streak+' ngày streak</span></div>'+
      '<div id="impPrev" style="margin-top:10px"></div></div>'+
    '<div class="card"><h3>Vùng nguy hiểm</h3>'+
      '<div class="row"><button class="btn ghost" id="rstDue">Đặt lại lịch ôn (giữ thống kê)</button>'+
      '<button class="btn ghost" id="rstAll" style="color:var(--bad)">Xóa toàn bộ tiến độ</button></div></div>'+
    '<div class="card"><h3>Thông tin</h3><div class="tiny muted">'+
      'Nghĩa tiếng Việt + pinyin + ví dụ: bộ dữ liệu nhúng trong file ('+WORDS.length+' từ, '+LESSONS.length+' hội thoại), dùng được 100% offline.<br>'+
      'IPA + audio + nghĩa mở rộng: Free Dictionary API (dictionaryapi.dev), chỉ khi có mạng.<br>'+
      'Phát âm: Web Speech API của trình duyệt. Tiếng Trung cần giọng <b>zh-CN</b> đã cài trên hệ điều hành.<br>'+
      'File này không gửi dữ liệu đi đâu cả.</div></div>';
  $("#thm").addEventListener("click",function(ev){ const b=ev.target.closest("[data-t]"); if(!b)return;
    s.theme=b.getAttribute("data-t"); document.documentElement.setAttribute("data-theme",s.theme); Store.set("theme",s.theme); renderSettings(); });
  $("#lim").addEventListener("change",function(){ Store.set("limit",+this.value); renderSettings(); });
  $("#rate").addEventListener("input",function(){ s.rate=+this.value; $("#rateLbl").textContent=s.rate.toFixed(2); });
  $("#rate").addEventListener("change",function(){ Store.set("rate",+this.value); renderSettings(); });
  $("#vEn").addEventListener("change",function(){ Store.set("voiceEn",this.value); TTS.speak("Hello, this is my voice.","en"); });
  $("#vZh").addEventListener("change",function(){ Store.set("voiceZh",this.value); TTS.speak("你好，这是我的声音。","zh"); });
  $("#exp").addEventListener("click",function(){
    const blob=new Blob([Store.raw()],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="lap-hoc-tu-"+todayStr()+".json"; document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
    toast("Đã xuất file tiến độ");
  });
  $("#impBtn").addEventListener("click",function(){ $("#imp").click(); });
  $("#imp").addEventListener("change",function(){
    const f=this.files&&this.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=function(){
      try{
        const j=JSON.parse(rd.result);
        if(!j||!j.version||!j.states) throw new Error("File không đúng định dạng của app này");
        const n=Object.keys(j.states).length;
        $("#impPrev").innerHTML='<div class="note">File có '+n+' từ đã học. Xác nhận nhập (sẽ ghi đè tiến độ hiện tại)? '+
          '<button class="btn sm" id="impYes">Nhập</button></div>';
        $("#impYes").addEventListener("click",function(){
          Store.loadJSON(j).then(function(){ toast("Đã nhập tiến độ"); paintPills(); renderSettings(); });
        });
      }catch(e){ $("#impPrev").innerHTML='<div class="err">Không đọc được file: '+esc(e.message)+'</div>'; }
    };
    rd.readAsText(f);
  });
  $("#rstDue").addEventListener("click",function(){
    if(!confirm("Đặt lại toàn bộ lịch ôn về hôm nay?")) return;
    Object.keys(Store.all()).forEach(function(k){ const st=Store.state(k); st.due=todayStr(); });
    Store.save(); toast("Đã đặt lại lịch ôn"); paintPills(); renderSettings();
  });
  $("#rstAll").addEventListener("click",function(){
    if(!confirm("Xóa TOÀN BỘ tiến độ, streak và từ tự thêm? Không hoàn lại được.")) return;
    Store.wipe().then(function(){ toast("Đã xóa sạch"); paintPills(); renderHome(); go("home"); });
  });
}
/* ============================ ĐIỀU HƯỚNG ============================ */
const SCREENS=[["home","Trang chủ"],["cards","Ôn thẻ"],["quiz","Quiz"],["lessons","Hội thoại"],["words","Từ vựng"],["lookup","Tra cứu"],["settings","Cài đặt"]];
let cur="home";
function go(name){
  cur=name;
  document.querySelectorAll("nav.tabs button").forEach(function(b){ b.classList.toggle("on",b.getAttribute("data-s")===name); });
  TTS.stop();
  window.scrollTo(0,0);
  if(name==="home") renderHome();
  else if(name==="cards") Cards.start(Store.s.lang,"smart");
  else if(name==="quiz") Quiz.build(Store.s.lang,10);
  else if(name==="lessons") renderLessons();
  else if(name==="words") Words.render();
  else if(name==="lookup") Lookup.render();
  else if(name==="settings") renderSettings();
  paintPills();
}
document.addEventListener("click",function(ev){
  const b=ev.target.closest("[data-go]"); if(b){ go(b.getAttribute("data-go")); return; }
  const l=ev.target.closest("[data-lesson]"); if(l){ LessonView.open(l.getAttribute("data-lesson")); }
});
function buildTabs(){
  $("#tabs").innerHTML=SCREENS.map(function(s){ return '<button data-s="'+s[0]+'">'+s[1]+'</button>'; }).join("");
  $("#tabs").addEventListener("click",function(ev){ const b=ev.target.closest("[data-s]"); if(b) go(b.getAttribute("data-s")); });
}
/* ============================ BOOT ============================ */
function boot(){
  Store.boot().then(function(){
    return Store.ready;
  }).then(function(){
    document.documentElement.setAttribute("data-theme",Store.s.theme||"dark");
    buildTabs();
    go("home");
    if(!TTS.supported){
      const n=document.createElement("div"); n.className="note";
      n.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:40";
      n.textContent="Trình duyệt này không có Web Speech API — sẽ không nghe được phát âm. Try Chrome/Edge/Safari.";
      document.body.appendChild(n);
    }
    if(Store.mode==="mem"){
      setTimeout(function(){ toast("Cảnh báo: không lưu được tiến độ (file:// bị chặn). Hãy Xuất JSON trước khi tắt tab."); },900);
    }
  });
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
})();
</script>
